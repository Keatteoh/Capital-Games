<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capital Games — Claymorphism (soft &amp; tactile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6ebe3;
    --surface: #fbf3ec;
    --fg: #4a3428;
    --muted: #9a7f6f;
    --accent: #b46a46;
    --accent-soft: #e9b493;
    --mint: #cdebdc;
    --sky: #d3e3f6;
    --lilac: #e4d8f4;
    --rose: #f7d0cc;
    --danger: #c0473a;
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Poppins', system-ui, sans-serif;
    --clay: 8px 8px 18px rgba(150, 100, 70, .22), -6px -6px 14px rgba(255, 255, 255, .85), inset 2px 2px 4px rgba(255,255,255,.7), inset -3px -3px 6px rgba(150,100,70,.12);
    --clay-in: inset 4px 4px 8px rgba(150,100,70,.18), inset -4px -4px 8px rgba(255,255,255,.8);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efe2d7; font-family: var(--font-body); color: var(--fg); }
  .caption { text-align: center; font-weight: 600; color: var(--muted); margin: 24px 0 12px; }

  .device { width: 393px; height: 852px; border-radius: 56px; padding: 12px; background: #1b1b1d; box-shadow: 0 30px 60px rgba(80,40,20,.25), inset 0 0 0 2px #3a3a3e; margin-bottom: 32px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 5; }
  .statusbar { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 16px; color: #000; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #000; }

  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 2px 18px 28px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Wallet hero: wealth is the big number */
  .wallet { border-radius: 30px; background: var(--surface); box-shadow: var(--clay); padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; }
  .wallet .k { font-size: 12px; font-weight: 500; color: var(--muted); }
  .wallet .big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--danger); letter-spacing: -.02em; }
  .wallet .inc { font-size: 13px; font-weight: 600; color: var(--danger); }
  .wallet .inc button { all: unset; cursor: pointer; text-decoration: underline dotted; }
  .daybadge { grid-row: span 3; align-self: start; text-align: center; border-radius: 22px; padding: 8px 12px; background: var(--lilac); box-shadow: var(--clay-in); }
  .daybadge b { display: block; font-size: 22px; font-weight: 800; line-height: 1; }
  .daybadge small { font-size: 11px; color: var(--muted); font-weight: 500; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .goal { flex: 1 1 100%; border-radius: 20px; padding: 10px 14px; background: var(--mint); box-shadow: var(--clay); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .goal small { margin-left: auto; color: #4f7d68; font-weight: 600; }
  .soft { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; box-shadow: var(--clay-in); }
  .soft.debt { background: var(--rose); color: var(--danger); }
  .soft.sleep { background: var(--lilac); color: #6b4f9a; }

  /* Card stack, mid-swipe */
  .stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
  .ghost { position: absolute; inset: 22px 26px 6px; border-radius: 34px; background: #f1e1d4; box-shadow: var(--clay); transform: rotate(-3deg); }
  .card {
    position: relative; width: 100%; height: 100%; border-radius: 34px; background: var(--surface); box-shadow: var(--clay);
    transform: translateX(-14px) rotate(-6deg); padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .stamp { position: absolute; top: 26px; right: 22px; transform: rotate(14deg); font-weight: 800; font-size: 22px; letter-spacing: .06em; color: var(--accent); border: 3px solid var(--accent); border-radius: 14px; padding: 2px 12px; background: rgba(251,243,236,.85); }
  .blob { flex: 1; min-height: 0; border-radius: 28px; background: var(--sky); box-shadow: var(--clay-in); display: grid; place-items: center; font-size: 84px; }
  .card h1 { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0; }
  .facts { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 600; }
  .facts span { padding: 5px 10px; border-radius: 12px; background: #f3e6db; box-shadow: var(--clay-in); }
  .facts .g { color: #3f7a5c; }
  .facts .r { color: var(--danger); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pillbtn { min-height: 56px; border: none; border-radius: 22px; font-family: var(--font-display); font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: var(--clay); }
  .pillbtn.apply { background: var(--accent); color: #fff; box-shadow: 8px 8px 18px rgba(150,100,70,.3), -6px -6px 14px rgba(255,255,255,.8), inset 2px 2px 4px rgba(255,255,255,.35), inset -3px -3px 6px rgba(90,40,20,.25); }
  .pillbtn.skip { background: var(--surface); color: var(--fg); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile { border-radius: 20px; padding: 8px 4px; text-align: center; box-shadow: var(--clay); }
  .tile b { display: block; font-size: 18px; font-weight: 800; }
  .tile small { font-size: 10px; font-weight: 600; color: var(--muted); }
  .t1 { background: var(--mint); } .t2 { background: var(--sky); } .t3 { background: var(--rose); } .t4 { background: var(--lilac); }
  .t3 b, .t4 b { color: var(--danger); }
</style>
</head>
<body>
<div>
  <p class="caption">Claymorphism — soft &amp; tactile</p>
  <div class="device">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span class="num">9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3C13.3 1.8 10.8.7 8 .7S2.7 1.8.8 3.6L2 4.9c1.6-1.5 3.7-2.4 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3C11.4 5 9.8 4.3 8 4.3S4.6 5 3.4 6.1l1.2 1.3C5.5 6.6 6.7 6.1 8 6.1zm0 3.5c.6 0 1.1.2 1.5.6L8 11.8 6.5 10.2c.4-.4.9-.6 1.5-.6z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" opacity=".4"/></svg>
        </span>
      </div>

      <div class="app">
        <section class="wallet" aria-label="Your money">
          <span class="k">Wealth</span>
          <div class="daybadge"><b class="num">8</b><small>Day · Wk 2</small></div>
          <span class="big num">-$19</span>
          <span class="inc"><button type="button">Income -$15/wk ▾</button></span>
        </section>

        <div class="row">
          <div class="goal">🎯 <strong>Get a job</strong><small>Goal 1 of 2</small></div>
          <span class="soft debt" role="alert">⚠️ In debt · out at -$100</span>
          <span class="soft sleep">😴 Under-slept</span>
        </div>

        <div class="stage">
          <div class="ghost" aria-hidden="true"></div>
          <article class="card">
            <span class="stamp" aria-hidden="true">APPLY</span>
            <div class="blob" aria-hidden="true">🛒</div>
            <h1>The supermarket is hiring shelf stackers. Apply?</h1>
            <div class="facts">
              <span class="g">🎲 40% · +$150/wk</span>
              <span>⏳ 14 days</span>
              <span class="r">-$5 once</span>
            </div>
          </article>
        </div>

        <div class="choices">
          <button class="pillbtn apply" type="button">← Apply</button>
          <button class="pillbtn skip" type="button">Skip →</button>
        </div>

        <div class="tiles">
          <div class="tile t1"><b class="num">1</b><small>Social</small></div>
          <div class="tile t2"><b class="num">1</b><small>Skills</small></div>
          <div class="tile t3"><b class="num">40</b><small>Health</small></div>
          <div class="tile t4"><b class="num">4h</b><small>Spare</small></div>
        </div>
      </div>
      <div class="home"></div>
    </div>
  </div>
</div>
</body>
</html>
