<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capital Games — Lingo (bright &amp; playful)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --fg: #3c3c3c;
    --muted: #777777;
    --line: #e5e5e5;
    --accent: #58cc02;
    --accent-edge: #58a700;
    --danger: #ff4b4b;
    --danger-edge: #ea2b2b;
    --warn: #ffc800;
    --sky: #1cb0f6;
    --sky-edge: #1899d6;
    --purple: #ce82ff;
    --font-display: 'Nunito', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f7f7f7; font-family: var(--font-body); color: var(--fg);
  }
  .caption { text-align: center; font-weight: 800; color: var(--muted); margin: 24px 0 12px; letter-spacing: .02em; }

  /* ---- Device frame ---- */
  .device {
    width: 393px; height: 852px; border-radius: 56px; padding: 12px;
    background: #1b1b1d; box-shadow: 0 30px 60px rgba(0,0,0,.18), inset 0 0 0 2px #3a3a3e;
    position: relative; margin-bottom: 32px;
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
    background: var(--bg); display: flex; flex-direction: column;
  }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 5; }
  .statusbar { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 800; font-size: 16px; color: #000; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #000; }

  /* ---- App ---- */
  .app { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 28px; min-height: 0; }
  .num { font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: center; gap: 10px; }
  .day { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 17px; }
  .day small { color: var(--muted); font-weight: 700; font-size: 13px; }
  .money { margin-left: auto; display: flex; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
    font-weight: 900; font-size: 15px; background: #fff; min-height: 44px;
  }
  .chip.bad { color: var(--danger); border-color: #ffc1c1; background: #fff5f5; }
  .chip .lbl { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; display: block; letter-spacing: .04em; }
  .chip .stack { display: flex; flex-direction: column; line-height: 1.05; }

  /* goal as a progress path */
  .goal { display: flex; align-items: center; gap: 10px; }
  .goal .trophy { width: 40px; height: 40px; border-radius: 12px; background: var(--warn); display: grid; place-items: center; font-size: 20px; box-shadow: inset 0 -4px 0 #e5a800; }
  .goal .track { flex: 1; }
  .goal .t { font-weight: 900; font-size: 15px; display: flex; justify-content: space-between; }
  .goal .t span { color: var(--muted); font-weight: 800; font-size: 13px; }
  .bar { height: 14px; border-radius: 8px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 8px; box-shadow: inset 0 4px 0 rgba(255,255,255,.3); }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; }
  .pill.debt { background: #ffdfe0; color: var(--danger-edge); }
  .pill.sleep { background: #f3e2ff; color: #9b4dd8; }

  /* card */
  .card {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 24px; padding: 18px 16px;
    text-align: center;
  }
  .card .art { width: 132px; height: 132px; border-radius: 32px; background: #ddf4ff; display: grid; place-items: center; font-size: 72px; box-shadow: inset 0 -6px 0 #b8e6fd; }
  .card h1 { font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1.2; margin: 6px 0 0; }
  .odds { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tag { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 10px; background: #f1f1f1; }
  .tag.good { background: #d7ffb8; color: var(--accent-edge); }
  .tag.cost { background: #ffdfe0; color: var(--danger-edge); }

  /* big 3D buttons */
  .actions { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
  .btn {
    border: none; border-radius: 16px; padding: 14px 10px; min-height: 56px;
    font-family: var(--font-display); font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .04em;
    cursor: pointer;
  }
  .btn-go { background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-edge); }
  .btn-skip { background: #fff; color: var(--sky); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
  .swipehint { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); margin-top: -4px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { border: 2px solid var(--line); border-radius: 14px; padding: 6px 4px; text-align: center; }
  .stat .ic { font-size: 18px; }
  .stat b { display: block; font-size: 17px; font-weight: 900; }
  .stat small { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat.low { border-color: #ffc1c1; background: #fff5f5; }
  .stat.low b { color: var(--danger); }
</style>
</head>
<body>
<div>
  <p class="caption">Lingo — bright &amp; playful</p>
  <div class="device">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span class="num">9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3C13.3 1.8 10.8.7 8 .7S2.7 1.8.8 3.6L2 4.9c1.6-1.5 3.7-2.4 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3C11.4 5 9.8 4.3 8 4.3S4.6 5 3.4 6.1l1.2 1.3C5.5 6.6 6.7 6.1 8 6.1zm0 3.5c.6 0 1.1.2 1.5.6L8 11.8 6.5 10.2c.4-.4.9-.6 1.5-.6z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" opacity=".4"/></svg>
        </span>
      </div>

      <div class="app">
        <div class="topbar">
          <div class="day">📅 <span class="num">Day 8</span> <small>Wk 2</small></div>
          <div class="money">
            <button class="chip bad" type="button" aria-label="Income, tap to see recurring payments">
              <span class="stack"><span class="lbl">Income ▾</span><span class="num">-$15/wk</span></span>
            </button>
            <div class="chip bad"><span class="stack"><span class="lbl">Wealth</span><span class="num">-$19</span></span></div>
          </div>
        </div>

        <div class="goal">
          <div class="trophy" aria-hidden="true">🏆</div>
          <div class="track">
            <div class="t">Get a job <span>Goal 1 of 2</span></div>
            <div class="bar" aria-hidden="true"><i></i></div>
          </div>
        </div>

        <div class="pills" role="alert">
          <span class="pill debt">⚠️ In debt · out at -$100</span>
          <span class="pill sleep">😴 Under-slept · health low</span>
        </div>

        <article class="card">
          <div class="art" aria-hidden="true">🛒</div>
          <h1>The supermarket is hiring shelf stackers. Apply?</h1>
          <div class="odds">
            <span class="tag good">🎲 40% · +$150/wk</span>
            <span class="tag">⏳ 14 days</span>
            <span class="tag cost">-$5 once</span>
          </div>
        </article>

        <div class="actions">
          <button class="btn btn-go" type="button">← Apply</button>
          <button class="btn btn-skip" type="button">Skip →</button>
        </div>
        <p class="swipehint">or swipe the card</p>

        <div class="stats">
          <div class="stat"><div class="ic">🤝</div><b class="num">1</b><small>Social</small></div>
          <div class="stat"><div class="ic">📘</div><b class="num">1</b><small>Skills</small></div>
          <div class="stat low"><div class="ic">❤️</div><b class="num">40</b><small>Health</small></div>
          <div class="stat low"><div class="ic">🌙</div><b class="num">4h</b><small>Spare</small></div>
        </div>
      </div>
      <div class="home"></div>
    </div>
  </div>
</div>
</body>
</html>
